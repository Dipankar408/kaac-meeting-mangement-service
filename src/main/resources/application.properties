# Karbi Anglong Autonomous Council - Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kaac_meetings_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:admin_user}
spring.datasource.password=${DB_PASSWORD:kaac@123}

# Disable H2 Console for Production Security
spring.h2.console.enabled=false

# Spring Data JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Schema Initialization Settings
# Controlled via Flyway/Liquibase or a production script rather than running every restart
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Thymeleaf Template Engine (Enable Caching for Production)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# KAAC Administrative Properties
kaac.council.name=Karbi Anglong Autonomous Council
kaac.council.secretariat=Diphu, Karbi Anglong, Assam
kaac.council.state=Assam
kaac.council.type=Sixth Schedule Autonomous Council