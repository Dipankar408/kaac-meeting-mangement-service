# Karbi Anglong Autonomous Council - Spring Boot Configuration
server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:kaac_meetings_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Data JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# KAAC Administrative Properties
kaac.council.name=Karbi Anglong Autonomous Council
kaac.council.secretariat=Diphu, Karbi Anglong, Assam
kaac.council.state=Assam
kaac.council.type=Sixth Schedule Autonomous Council
